name: Magic Spoon
description: >-
  Magic Spoon is a direct-to-consumer breakfast brand selling high-protein,
  low-sugar cereal, oatmeal, granola, treats, and toaster pastries through its
  Shopify-powered online store and major retailers including Whole Foods,
  Target, Costco, Walmart, Kroger, and Sprouts. The company reformulates
  childhood-classic cereals to be keto-friendly and gluten-free, offering a
  subscribe-and-save model. Magic Spoon is a consumer packaged goods (CPG)
  ecommerce company backed by Lightspeed Venture Partners; it operates a retail
  storefront rather than a public developer platform, and this profile was
  surfaced as a VC portfolio company and added to the API Evangelist network.
